name: Build & Release CleanScreen APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/app-release.apk release_output/CleanScreen-v1.0.8-Xiaomi-HyperOS.apk
          cp app/build/outputs/apk/release/app-release.apk release_output/CleanScreen-v1.0.8-iQOO-OriginOS.apk
          cp app/build/outputs/apk/release/app-release.apk release_output/CleanScreen-v1.0.8-Universal.apk
          ls -lh release_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanScreen-v1.0.8
          path: release_output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.8
          name: "清屏 CleanScreen v1.0.8 (Shizuku高权限特权引擎 & 悬浮窗审查取词器)"
          body: |
            ### 🚀 清屏 (CleanScreen) v1.0.8 重磅升级发布

            全面借鉴 GitHub 顶尖开源项目（**AutoSkip、SKIP、GKD、Android-Touch-Helper、李跳跳**）的最新技术精髓，专为 **iQOO Neo 11 (OriginOS 6 / Android 16)** 与 **小米 14 / 15 / 16 (HyperOS 1/2)** 打造！

            #### ✨ v1.0.8 核心突破与创新功能：
            1. **【AutoSkip / GKD 体系】Shizuku 高权限特权引擎集成**：
               - 引入 Shizuku 系统特权 Binder API，支持无线调试授权；
               - **一键穿透 OriginOS 6 限制**：在主界面或诊断页即可一键自动解除 Android 16【受限制的设置】(Restricted Settings) 并激活无障碍服务，完全免去手动前往设置翻找的繁琐流程；
               - 免 Root 底层注入与保活，彻底摆脱定制 ROM 后台无障碍杀停困扰。
            2. **【SKIP 体系】屏幕节点审查悬浮窗 (Floating Inspector)**：
               - 引入可拖拽的桌面极简悬浮球；
               - 打开任意未知或冷门 App 开屏广告时，点击悬浮球即可毫秒级冻结并提取该界面的 View ID、文本、Activity 与屏幕绝对/相对坐标；
               - 支持**“测试点击”**现场验证，支持**“一键保存为规则”**自动导入规则中心，告别手动写规则！
            3. **【Android-Touch-Helper 体系】相对坐标手势点击兜底 (Coordinate Fallback)**：
               - 规则引擎全新支持相对坐标比例（如右上角 88%, 6%）手势点击；
               - 彻底攻克 Flutter、Unity 游戏引擎及自绘 Canvas 等无原生文本节点的顽固开屏广告。
            4. **【李跳跳体系】坚守 100% 离线 · 零网络权限承诺**：
               - 全工程无任何 `android.permission.INTERNET` 权限声明，零流量消耗，零数据外泄可能，给无障碍服务带来极致安全感。
            5. **【GKD 体系】全量 35+ 主流 App 规则中心**：
               - 持续收录国内主流高频 App 开屏跳过规则，支持实时模糊搜索与单规则启闭。
          files: |
            release_output/CleanScreen-v1.0.8-Xiaomi-HyperOS.apk
            release_output/CleanScreen-v1.0.8-iQOO-OriginOS.apk
            release_output/CleanScreen-v1.0.8-Universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APKs to jsDelivr CDN branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B apk
          git rm -rf .
          cp release_output/*.apk .
          git add *.apk
          git commit -m "dist: update release APK binaries for jsDelivr CDN [skip ci]" || true
          git push origin apk --force
