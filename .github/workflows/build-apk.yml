name: Build & Release CleanScreen APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/app-release.apk release_output/CleanScreen-v1.0.5-Xiaomi-HyperOS.apk
          cp app/build/outputs/apk/release/app-release.apk release_output/CleanScreen-v1.0.5-iQOO-OriginOS.apk
          cp app/build/outputs/apk/release/app-release.apk release_output/CleanScreen-v1.0.5-Universal.apk
          ls -lh release_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanScreen-v1.0.5
          path: release_output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.5
          name: "清屏 CleanScreen v1.0.5 (纯净无障碍架构 & 异常链路修复)"
          body: |
            ### 📱 清屏 (CleanScreen) v1.0.5 纯净无障碍架构修复版

            全面适配 **iQOO Neo 11 (OriginOS 5/6)** 与 **小米 14 / 15 旗舰 (HyperOS 1/2)**！

            #### 🛠️ v1.0.5 核心技术重构与修复：
            1. **剥离混合服务架构，重回纯净无障碍**：
               - 彻底移除 `CleanScreenAccessibilityService` 上的 `foregroundServiceType="specialUse"` 声明；
               - 移除未使用的前台服务权限，交由 Android 系统 `AccessibilityManagerService` 规范托管生命周期，消除 Android 14+ / OriginOS 6 绑定时的服务类型冲突。
            2. **修复全局异常处理器缺陷**：
               - 重构 `CleanScreenApp.kt` 异常捕获逻辑，在捕获日志后准确委派回系统默认 `UncaughtExceptionHandler`，避免由于吞噬异常导致 Binder 线程僵死或进程被系统强制剥离无障碍。
            3. **精准呈现真实运行状态**：
               - 主界面重构状态检查：明确区分「系统记录已启用」与「服务进程实际已连接」，若服务因权限受限或挂起未连接，提供精准修复引导与一键解除受限设置。
          files: |
            release_output/CleanScreen-v1.0.5-Xiaomi-HyperOS.apk
            release_output/CleanScreen-v1.0.5-iQOO-OriginOS.apk
            release_output/CleanScreen-v1.0.5-Universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
