name: Build & Release CleanScreen APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/app-release.apk release_output/CleanScreen-v1.0.6-Xiaomi-HyperOS.apk
          cp app/build/outputs/apk/release/app-release.apk release_output/CleanScreen-v1.0.6-iQOO-OriginOS.apk
          cp app/build/outputs/apk/release/app-release.apk release_output/CleanScreen-v1.0.6-Universal.apk
          ls -lh release_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanScreen-v1.0.6
          path: release_output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.6
          name: "清屏 CleanScreen v1.0.6 (深度生命周期监测 & Android 16 OriginOS 6 诊断排查版)"
          body: |
            ### 📱 清屏 (CleanScreen) v1.0.6 深度诊断与生命周期重构版

            专为 **iQOO Neo 11 (OriginOS 6 / Android 16)** 与 **小米 14 / 15 / 16 (HyperOS 1/2)** 打造！

            #### 🛠️ v1.0.6 核心技术升级与问题修复：
            1. **新增【无障碍实时深度诊断】控制台**：
               - 实时诊断 Android 16 敏感权限受限制设置 (Restricted Settings / OP_ACCESS_RESTRICTED_SETTINGS)；
               - 明确区分五大核心运行状态（NOT_CONFIGURED / CONFIGURED_NOT_BOUND / RUNNING / CONNECTION_LOST / UNKNOWN）；
               - 实时监控 AMS 绑定、全局无障碍状态与内存服务实例，杜绝虚假“已开启”假象。
            2. **补全完整无障碍生命周期链路**：
               - 规范重构 `onCreate()`, `onServiceConnected()`, `onUnbind()`, `onDestroy()`, `onInterrupt()`；
               - 在 `onServiceConnected()` 中通过代码动态强化注入 `serviceInfo`，消除不同厂商定制 ROM 解析 XML 元数据的偏差。
            3. **无障碍事件通道彻底异步与零耗时优化**：
               - 剥离无障碍事件响应与数据库的同步读写，数据库写操作迁移至独立单线程后台执行池；
               - 引入应用规则内存缓存，彻底杜绝主线程 SQLite 查询导致的 Binder 阻塞与系统看门狗杀停。
            4. **全链路生命周期流转记录**：
               - 内置环形缓冲区记录最近 30 条详细生命周期事件与毫秒级时间戳、PID，支持一键复制完整诊断报告。
          files: |
            release_output/CleanScreen-v1.0.6-Xiaomi-HyperOS.apk
            release_output/CleanScreen-v1.0.6-iQOO-OriginOS.apk
            release_output/CleanScreen-v1.0.6-Universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
