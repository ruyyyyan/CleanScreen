name: Build & Release CleanScreen APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/app-release.apk release_output/CleanScreen-v1.0.4-Xiaomi-HyperOS.apk
          cp app/build/outputs/apk/release/app-release.apk release_output/CleanScreen-v1.0.4-iQOO-OriginOS.apk
          cp app/build/outputs/apk/release/app-release.apk release_output/CleanScreen-v1.0.4-Universal.apk
          ls -lh release_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanScreen-v1.0.4
          path: release_output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "清屏 CleanScreen v1.0.4 (适配小米 14/15 旗舰 HyperOS 与 iQOO Neo 11)"
          body: |
            ### 📱 清屏 (CleanScreen) v1.0.4 小米澎湃OS & vivo双旗舰正式版

            全面适配 **小米 14 / 14 Pro / 14 Ultra / 15 / 15 Pro / 15 Ultra (HyperOS 澎湃OS)** 与 **iQOO Neo 11 / vivo (OriginOS)**！

            #### 🌟 核心新特性与优化
            1. **小米 HyperOS 1 / HyperOS 2 深度适配**：
               - 内置小米专用的后台保活通道，一键直达小米神隐模式将省电策略切换为【无限制】；
               - 一键直达小米安全中心开启【自启动】与【应用关联启动】；
               - 针对 HyperOS 10 秒安全警告倒计时与“受限设置”提供专属指引。
            2. **智能设备识别**：
               - 打开应用自动识别机型系统，动态呈现对应的系统保活设置引导卡片。
            3. **精准时空窗口防误触**：
               - 严格限定在应用启动前 3.5 秒内检索跳过按钮，进入应用内永久停止扫描，100% 杜绝误触。
            4. **轻量防卡死引擎**：
               - 极速响应，移除繁重视图监听，彻底解决系统无障碍自动关闭问题。
          files: |
            release_output/CleanScreen-v1.0.4-Xiaomi-HyperOS.apk
            release_output/CleanScreen-v1.0.4-iQOO-OriginOS.apk
            release_output/CleanScreen-v1.0.4-Universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
