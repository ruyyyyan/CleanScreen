name: Build & Release CleanScreen APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/app-release.apk release_output/CleanScreen-v1.0.1-iQOONeo11.apk
          ls -lh release_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanScreen-v1.0.1-iQOONeo11
          path: release_output/CleanScreen-v1.0.1-iQOONeo11.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "清屏 CleanScreen v1.0.1 (修复无障碍与保活崩溃)"
          body: |
            ### 📱 清屏 (CleanScreen) v1.0.1 紧急修复版

            针对 Android 14/15 及 iQOO Neo 11 / OriginOS 闪退问题的全面修复：
            - 🛠️ **修复点开即闪退问题**：移除 Application 初始化阶段非法的 startForegroundService，解决 Android 14 前台服务限制导致的崩溃。
            - 🛠️ **修复无障碍服务开启后自关/闪退**：重构前台守护服务与 ServiceCompat 兼容层，添加全链路异常捕获保护。
            - 🛠️ **优化界面事件防循环触发**：修复主界面开关更新导致的无障碍设置跳转与死循环。
            - 🎨 **替换控件背景 Drawable**：避免矢量图背景在不同系统版本中导致的 InflateException。
          files: release_output/CleanScreen-v1.0.1-iQOONeo11.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
